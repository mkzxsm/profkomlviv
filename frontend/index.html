<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/under_cards.png" />
    <link rel="preload" as="image" href="/under_cards.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Профком студентів ЛНУ ім. Івана Франка</title>
    <style>
      #page-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: grid;
        place-items: center;
        background: #f8fafc;
        transition: opacity 0.55s ease, visibility 0.55s ease;
      }

      #page-loader.is-done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      body.is-loading {
        overflow: hidden;
      }

      .page-loader__scene {
        --size: min(80vw, 320px);
        position: relative;
        width: var(--size);
        height: var(--size);
        display: grid;
        place-items: center;
      }

      .page-loader__orbit {
        position: absolute;
        inset: 0;
        overflow: visible;
        pointer-events: none;
      }

      .page-loader__orbit--cw {
        animation: page-loader-spin 2s linear infinite;
      }

      .page-loader__orbit--ccw {
        animation: page-loader-spin-rev 2s linear infinite;
      }

      .page-loader__circle {
        fill: none;
        stroke: #3d5a99;
        stroke-width: 3;
        stroke-linecap: round;
        /* r=46 → C≈289.027; 3 риски по колу */
        stroke-dasharray: 42 54.342;
      }

      /* Дві риски на тих самих місцях — третя прибрана, решта не зсунуті */
      .page-loader__circle--two {
        stroke-dasharray: 42 54.342 42 150.685;
      }

      .page-loader__logo {
        width: 70%;
        height: 70%;
        object-fit: contain;
        position: relative;
        z-index: 2;
        user-select: none;
        pointer-events: none;
        filter: drop-shadow(0 14px 28px rgba(30, 42, 90, 0.18));
        animation: page-loader-breathe 2.6s ease-in-out infinite;
      }

      @keyframes page-loader-spin {
        to { transform: rotate(360deg); }
      }

      @keyframes page-loader-spin-rev {
        to { transform: rotate(-360deg); }
      }

      @keyframes page-loader-breathe {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.035); }
      }

      @media (prefers-reduced-motion: reduce) {
        .page-loader__orbit,
        .page-loader__logo {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body class="is-loading">
    <div id="page-loader" role="status" aria-live="polite" aria-label="Завантаження сторінки">
      <div class="page-loader__scene">
        <svg class="page-loader__orbit page-loader__orbit--cw" viewBox="0 0 100 100" aria-hidden="true">
          <circle class="page-loader__circle" cx="50" cy="50" r="46" />
        </svg>

        <svg class="page-loader__orbit page-loader__orbit--ccw" viewBox="0 0 100 100" aria-hidden="true">
          <circle class="page-loader__circle page-loader__circle--two" cx="50" cy="50" r="46" />
        </svg>

        <img
          class="page-loader__logo"
          src="/under_cards.png"
          alt="Логотип Профкому студентів ЛНУ"
          width="224"
          height="224"
        />
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
